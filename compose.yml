services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_NAME:-contract_engine}
      POSTGRES_USER: ${DB_USER:-contract_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
